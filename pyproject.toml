[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zuspec-be-py"
dynamic = ["version"]
description = "Zuspec live-Python backend: Zuspec IR to executable Python (zdc) classes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matthew Ballance", email = "matt.ballance@gmail.com"}
]

dependencies = [
    "zuspec-ir-core",
    # Imported at module scope by solver/core/constraint_system.py.
    "networkx>=3.0",
]

[project.optional-dependencies]
# The IR-driven backend (builder/runtime/solver) is self-contained. The legacy
# ``@zdc``-authored entry points (parsing Python activity()/constraint source,
# DataModelFactory, contract checking) reach back into the dataclasses frontend
# via lazy imports; install this extra to use them.
zdc = [
    "zuspec-dataclasses",
]
dev = [
    "zuspec-dataclasses",
    "pytest>=6.0",
    "pytest-dfm",
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/zuspec/zuspec-be-py"
Repository = "https://github.com/zuspec/zuspec-be-py"

[tool.setuptools]
package-dir = {"" = "src"}

# Auto-discovery rather than an explicit list. The list said ["zuspec.be.py"]
# and so shipped 4 of the 126 modules under src/ -- everything in rt/, model/
# and the other subpackages was silently absent from the wheel, and
# `from zuspec.be.py import model` failed on an installed release while
# working in a source checkout. namespaces = true is required: zuspec/ and
# zuspec/be/ are PEP 420 namespace dirs with no __init__.py.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers --strict-config --showlocals"
markers = [
    "unit: Unit tests",
    "performance: Performance tests",
    "slow: Tests that take a long time to run",
    "integration: Integration tests",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

